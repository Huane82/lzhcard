    const fsZoomOutBtn = shell.querySelector('#fsZoomOutBtn');
    if (vp && sb) {
      bindOverlayZoomGestures(vp, sb, state.fsZoom, fsResetBtn);
      if (fsZoomInBtn) fsZoomInBtn.onclick = () => { state.fsZoom.scale = Math.min(2.5, state.fsZoom.scale * 1.2); applyOverlayZoomTransform(sb, state.fsZoom, fsResetBtn); };
      if (fsZoomOutBtn) fsZoomOutBtn.onclick = () => {
        state.fsZoom.scale = Math.max(0.75, state.fsZoom.scale / 1.2);
        if (state.fsZoom.scale <= 1.01) { state.fsZoom.tx = 0; state.fsZoom.ty = 0; }
        applyOverlayZoomTransform(sb, state.fsZoom, fsResetBtn);
      };
      if (fsResetBtn) fsResetBtn.onclick = () => { state.fsZoom = { scale: 1, tx: 0, ty: 0 }; applyOverlayZoomTransform(sb, state.fsZoom, fsResetBtn); };
    }

    const exitBtn = shell.querySelector('#fsExitBtn');
    if (exitBtn) {
      exitBtn.onclick = () => {
        state.fullscreenOpen = false;
        state.fsBubble = null;
        if (state.fullscreenFromFreezeService) window.AndroidOverlay?.closeFreezeMode();
        render();
      };
    }
    const lookBtn = shell.querySelector('#fsLookBtn');
    if (lookBtn) lookBtn.onclick = () => { state.photoMode = 'lookup'; render(); };
    const selBtn = shell.querySelector('#fsSelBtn');
    if (selBtn) selBtn.onclick = () => { state.photoMode = 'select'; state.fsBubble = null; render(); };
    const allBtn = shell.querySelector('#fsAllBtn');
    if (allBtn) allBtn.onclick = () => { state.photoTokens.forEach(t => state.photoSelectedIds.add(t.id)); state.photoMode = 'select'; render(); };
    const rescanBtn = shell.querySelector('#fsAiRescanBtn');
    if (rescanBtn) rescanBtn.onclick = () => { if (state.photoBase64) analyzePhotoBase64(state.photoBase64, true); };
    const fsFullTransBtn = shell.querySelector('#fsFullTranslateBtn');
    if (fsFullTransBtn) fsFullTransBtn.onclick = translateOverlayPhotoArticle;
    const fsCopyBtn = shell.querySelector('#fsCopyFullTransBtn');
    if (fsCopyBtn) fsCopyBtn.onclick = copyOverlayPhotoTranslation;
    const fsOrigBtn = shell.querySelector('#fsToggleOrigBtn');
    if (fsOrigBtn) fsOrigBtn.onclick = () => { state.photoArticleShowOrig = !state.photoArticleShowOrig; render(); };

    shell.querySelectorAll('[data-fstok]').forEach(btn => {
      btn.onclick = () => {
        if (Date.now() < pinchGuardUntil) return;
        const id = btn.getAttribute('data-fstok');
        const tk = state.photoTokens.find(x => x.id === id);
        if (!tk) return;
        if (state.photoMode === 'select') {
          if (state.photoSelectedIds.has(id)) state.photoSelectedIds.delete(id);
          else state.photoSelectedIds.add(id);
          render();
        } else {
          state.photoActiveId = id;
          lookupWordDetails(tk.text, tk.lang, { phonetic: tk.reading, pos: tk.pos, meaning: tk.translation }, 'fsBubble');
        }
      };
    });
    shell.querySelectorAll('[data-fschip]').forEach(btn => {
      btn.onclick = () => { state.photoSelectedIds.delete(btn.getAttribute('data-fschip')); render(); };
    });
    const fsImp = shell.querySelector('#fsConfirmImportBtn');
    if (fsImp) {
      fsImp.onclick = async () => {
        const picked = state.photoTokens.filter(t => state.photoSelectedIds.has(t.id)).map(t => ({
          word: t.text, lang: t.lang, pos: t.pos, phonetic: t.reading, meaning: t.translation
        }));
        await saveCardsToLZHCard(picked, fsImp);
        state.photoSelectedIds.clear();
        render();
      };
    }
  }

  function render() {
    const appPanel = document.getElementById('appPanel');
    if (state.fullscreenFromFreezeService) {
      if (appPanel) appPanel.classList.add('hidden');
      renderFreezeViewer();
      bindCommonBubbleAndDeckEvents(document.getElementById('freezeShell'));
      return;
    }

    if (appPanel) appPanel.classList.remove('hidden');
    document.getElementById('nativeLangBtn').textContent = nativeCfg().short;
    document.getElementById('viewModeToggleText').innerHTML = state.viewMode === 'chat'
      ? `${OV_SVG.chat}<span>聊天</span>${OV_SVG.arrows}${OV_SVG.globe}<span>翻譯</span>`
      : `${OV_SVG.globe}<span>翻譯</span>${OV_SVG.arrows}${OV_SVG.chat}<span>聊天</span>`;
    document.getElementById('translatorTabs').classList.toggle('hidden', state.viewMode === 'chat');
    document.getElementById('nativeLangBtn').classList.toggle('hidden', state.viewMode === 'chat');

    const myUid = state.chatSession?.uid || '';
    const hasUnread = myUid && Array.isArray(state.chatSession?.threads) && state.chatSession.threads.some(th => (th.updatedAt || 0) > ((th.readBy && th.readBy[myUid]) || 0) && th.lastSenderUid !== myUid);
    document.getElementById('chatUnreadDot').classList.toggle('hidden', !hasUnread);

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-tab') === state.activeTab);
    });

    const body = document.getElementById('panelBody');
    if (state.viewMode === 'chat') {
      renderChatView(body);
    } else if (state.activeTab === 'camera') {
      renderCameraTab(body);
    } else if (state.activeTab === 'screen') {
      renderScreenTab(body);
    } else {
      renderSubtitleTab(body);
    }

    bindPanelEvents();
    bindCommonBubbleAndDeckEvents(body);
    renderFreezeViewer();
    if (state.fullscreenOpen) bindCommonBubbleAndDeckEvents(document.getElementById('freezeShell'));

    const vp = document.getElementById('inlineStageViewport');
    const sb = document.getElementById('inlineStageBox');
    const inlineImg = document.getElementById('inlineStageImg');
    if (inlineImg) {
      inlineImg.onload = () => setImageModeLock(true);
    }
    const inResetBtn = document.getElementById('inlineZoomResetBtn');
    const inZoomInBtn = document.getElementById('inlineZoomInBtn');
    const inZoomOutBtn = document.getElementById('inlineZoomOutBtn');
    if (vp && sb) {
      bindOverlayZoomGestures(vp, sb, state.inlineZoom, inResetBtn);
      if (inZoomInBtn) inZoomInBtn.onclick = () => { state.inlineZoom.scale = Math.min(2.5, state.inlineZoom.scale * 1.2); applyOverlayZoomTransform(sb, state.inlineZoom, inResetBtn); };
      if (inZoomOutBtn) inZoomOutBtn.onclick = () => {
        state.inlineZoom.scale = Math.max(0.75, state.inlineZoom.scale / 1.2);
        if (state.inlineZoom.scale <= 1.01) { state.inlineZoom.tx = 0; state.inlineZoom.ty = 0; }
        applyOverlayZoomTransform(sb, state.inlineZoom, inResetBtn);
      };
      if (inResetBtn) inResetBtn.onclick = () => { state.inlineZoom = { scale: 1, tx: 0, ty: 0 }; applyOverlayZoomTransform(sb, state.inlineZoom, inResetBtn); };
    }

    if (appPanel) {
      appPanel.classList.toggle('ft-fullscreen', state.panelFullscreen);
    }
    const fsHeaderBtn = document.getElementById('panelFullscreenBtn');
    if (fsHeaderBtn) {
      fsHeaderBtn.title = state.panelFullscreen ? '還原視窗尺寸' : '切換全螢幕';
      fsHeaderBtn.setAttribute('aria-pressed', state.panelFullscreen ? 'true' : 'false');
    }

    notifyNativeHeight();
  }

  function bindCommonBubbleAndDeckEvents(scope) {
    if (!scope) return;
    const deckBtn = scope.querySelector('#deckDropdownBtn');
    if (deckBtn) {
      deckBtn.onclick = (e) => { e.stopPropagation(); state.deckMenuOpen = !state.deckMenuOpen; render(); };
    }
    scope.querySelectorAll('[data-pick-deck]').forEach(opt => {
      opt.onclick = (e) => {
        e.stopPropagation();
        const v = opt.getAttribute('data-pick-deck');
        state.deckMenuOpen = false;
        if (v === '__NEW__') state.newDeckPromptOpen = true;
        else { state.newDeckPromptOpen = false; state.selectedDeck = v; }
        render();
      };
    });
    const newDeckInp = scope.querySelector('#newDeckInput');
    if (newDeckInp) newDeckInp.oninput = () => { state.newDeckNameInput = newDeckInp.value; };
    const applyDeckBtn = scope.querySelector('#applyNewDeckBtn');
    if (applyDeckBtn) {
      applyDeckBtn.onclick = () => {
        const name = (newDeckInp ? newDeckInp.value : state.newDeckNameInput).trim();
        if (name) { ensureDeckInList(name); state.newDeckPromptOpen = false; }
        render();
      };
    }
    scope.querySelectorAll('[data-bubble-close]').forEach(btn => {
      btn.onclick = () => { state[btn.getAttribute('data-bubble-close')] = null; render(); };
    });
    scope.querySelectorAll('[data-bubble-speak]').forEach(btn => {
      btn.onclick = () => {
        const b = state[btn.getAttribute('data-bubble-speak')];
        if (b) window.AndroidOverlay?.speakText(b.word, b.lang);
      };
    });
    scope.querySelectorAll('[data-bubble-add]').forEach(btn => {
      btn.onclick = async () => {
        const b = state[btn.getAttribute('data-bubble-add')];
        if (!b) return;
        await saveCardsToLZHCard([{ word: b.word, lang: b.lang, pos: b.pos, phonetic: b.phonetic, meaning: b.meaning }], btn);
      };
    });
  }

  function bindPanelEvents() {
    const freezeTrigger = () => window.AndroidOverlay?.startScreenFreezeLookup();
    const freezeBtn = document.getElementById('screenFreezeBtn');
    if (freezeBtn) freezeBtn.onclick = freezeTrigger;
    const freezeHeroBtn = document.getElementById('screenFreezeHeroBtn');
    if (freezeHeroBtn) freezeHeroBtn.onclick = freezeTrigger;

    const camTake = document.getElementById('camTakeBtn');
    if (camTake) camTake.onclick = () => { setImageModeLock(true); window.AndroidOverlay?.openImagePicker(true); };
    const camGal = document.getElementById('camGalBtn');
    if (camGal) camGal.onclick = () => { setImageModeLock(true); window.AndroidOverlay?.openImagePicker(false); };
    const pLook = document.getElementById('pModeLook');
    if (pLook) pLook.onclick = () => { state.photoMode = 'lookup'; render(); };
    const pSel = document.getElementById('pModeSel');
    if (pSel) pSel.onclick = () => { state.photoMode = 'select'; state.bubble = null; render(); };
    const pOpenFs = document.getElementById('pOpenFsBtn');
    if (pOpenFs) pOpenFs.onclick = () => { state.fullscreenOpen = true; setImageModeLock(true); render(); };
    const pAll = document.getElementById('pSelAll');
    if (pAll) pAll.onclick = () => { state.photoTokens.forEach(t => state.photoSelectedIds.add(t.id)); state.photoMode = 'select'; render(); };

  async function runScratchTranslate() {
    const txt = state.scratchText.trim();
    if (!txt) return;
    state.isScratchBusy = true;
    render();
    try {
      const cfg = nativeCfg();
      const tr = await callGemini(`將以下文字通順翻譯成「${cfg.aiName}」。自動忽略句首或句尾殘留的 OCR 亂碼符號，遇到口語俚語依語境自然意譯（如 new whip -> 新車／座駕），僅輸出譯文：\n${txt}`)
        .catch(() => gtxTranslate(txt, detectLang(txt), cfg.code));
      state.scratchTrans = tr || '';
    } finally {
      state.isScratchBusy = false;
      render();
    }
  }

  function getOverlayEffectiveRawText() {
    if (state.photoRawText && state.photoRawText.trim()) return state.photoRawText.trim();
    if (Array.isArray(state.photoTokens) && state.photoTokens.length > 0) {
      return state.photoTokens.map(t => String(t.text || '').trim()).filter(Boolean).join(' ');
    }
    return '';
  }

  async function copyOverlayPhotoTranslation() {
    const clean = String(state.photoArticleTranslation || '').trim();
    if (!clean) {
      window.AndroidOverlay?.showNativeToast?.('尚無整篇譯文可複製');
      return false;
    }
    let copied = false;
    try {
      if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
        await navigator.clipboard.writeText(clean);
        copied = true;
      }
    } catch (e) {}
    if (!copied) {
      try {
        const ta = document.createElement('textarea');
        ta.value = clean;
        ta.setAttribute('readonly', 'true');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        copied = Boolean(document.execCommand('copy'));
        document.body.removeChild(ta);
      } catch (e) {}
    }
    window.AndroidOverlay?.showNativeToast?.(copied ? '已複製整篇中文譯文' : '複製失敗，請手動選取複製');
    return copied;
  }

  async function translateOverlayPhotoArticle() {
    if (state.isPhotoArticleTranslating) return;
    const rawText = getOverlayEffectiveRawText();
    const cleanB64 = state.photoBase64 && state.photoBase64.includes(',') ? state.photoBase64.split(',')[1] : (state.photoBase64 || '');
    if (!rawText && !cleanB64) {
      window.AndroidOverlay?.showNativeToast?.('請先拍照或選圖後再執行整篇翻譯');
      return;
    }
    state.isPhotoArticleTranslating = true;
    render();
    try {
      let translated = '';
      try {
        if (rawText) {
          const prompt = `請將以下圖片／文章原文完整翻譯成自然流暢的「繁體中文」，嚴格保留原本的段落換行結構，僅直接輸出翻譯結果（不要加解釋或 Markdown）：\n\n${rawText}`;
          translated = await callGemini(prompt, null, 'def_fill');
        } else if (cleanB64) {
          const prompt = `請辨識這張圖片中的所有段落與文字，完整翻譯成自然流暢的「繁體中文」，保留原有段落換行結構，僅直接輸出中文譯文。`;
          translated = await callGemini(prompt, { mimeType: 'image/jpeg', data: cleanB64 }, 'vision_ocr');
        }
      } catch (e) {}

      if (!translated && rawText) {
        try {
          translated = await gtxTranslate(rawText.slice(0, 3500), detectLang(rawText), 'zh-TW');
        } catch (e) {}
      }

      translated = String(translated || '').trim();
      if (!translated) {
        window.AndroidOverlay?.showNativeToast?.('整篇翻譯失敗，請稍後再試');
        return;
      }
      state.photoArticleTranslation = translated;
      window.AndroidOverlay?.showNativeToast?.('整篇翻譯成中文完成！');
    } finally {
      state.isPhotoArticleTranslating = false;
      render();
    }
  }

  async function analyzePhotoBase64(b64, keepFullscreen) {
    state.activeTab = 'camera';
    state.photoBase64 = b64;
    state.photoDataUrl = b64.startsWith('data:') ? b64 : ('data:image/jpeg;base64,' + b64);
    state.photoTokens = [];
    state.photoSummary = '';
    state.photoRawText = '';
    state.photoArticleTranslation = '';
    state.isPhotoArticleTranslating = false;
    state.photoSelectedIds.clear();
    state.isVisionBusy = true;
    state.fullscreenOpen = keepFullscreen !== false;
    render();

    const cfg = nativeCfg();
    const cleanB64 = state.photoBase64.includes(',') ? state.photoBase64.split(',')[1] : state.photoBase64;
    const prompt = `對這張圖片進行高精準多語 OCR 與詞彙定位。rawText 請保留並輸出圖片完整原文（依自然閱讀順序與換行）。tokens 回傳最多 80 個字詞，每個附上正規化邊界框 box:[ymin,xmin,ymax,xmax]（0~1000整數）。
lang 為 en|ja|zh-TW；reading 英文填 IPA、日文必須填純平假名讀音；translation 與 summary 使用「${cfg.aiName}」。
只輸出純 JSON：{"rawText":"","summary":"","tokens":[{"text":"","lang":"en|ja|zh-TW","reading":"","pos":"","translation":"","box":[0,0,100,200]}]}`;
    try {
      const raw = await callGemini(prompt, { mimeType: 'image/jpeg', data: cleanB64 }, 'vision_ocr');
      const obj = safeJson(raw);
      state.photoSummary = obj.summary || '';
      state.photoRawText = String(obj.rawText || '').trim();
      state.photoTokens = (Array.isArray(obj.tokens) ? obj.tokens : []).map((t, i) => ({
        id: 'pt_' + i,
        text: String(t.text || '').trim(),
        lang: t.lang || detectLang(t.text),
        reading: String(t.reading || '').trim(),
        pos: String(t.pos || '').trim(),
        translation: String(t.translation || '').trim(),
        box: normalizeBox1000(t.box) || [0, 0, 100, 100]
      })).filter(x => x.text);
      if (!state.photoRawText && state.photoTokens.length > 0) {
        state.photoRawText = state.photoTokens.map(t => t.text).join(' ');
      }
    } catch (e) {
      if (e && e.code === 'QUOTA_EXCEEDED') {
        window.AndroidOverlay?.showNativeToast('雲端 AI 拍照額度已達上限，請使用「螢幕定格點詞 (免費 ML Kit)」或升級方案／填寫個人 Key');
      } else {
        window.AndroidOverlay?.showNativeToast('圖片辨識失敗，請稍後再試');
      }
    } finally {
      state.isVisionBusy = false;
      render();
    }
  }

  (function bindDrag() {
    const handle = document.getElementById('dragHandle');
    let dragging = false, lastX = 0, lastY = 0;
    handle.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      dragging = true;
      lastX = e.screenX;
      lastY = e.screenY;
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
    });
    handle.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = Math.round(e.screenX - lastX);
      const dy = Math.round(e.screenY - lastY);
      lastX = e.screenX;
      lastY = e.screenY;
      if (dx !== 0 || dy !== 0) window.AndroidOverlay?.movePanelBy(dx, dy);
    });
    const end = (e) => {
      if (!dragging) return;
      dragging = false;
      try { handle.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  })();

  (function bindOvVisualCropper() {
    const modal = document.getElementById('ovVisualRoiModal');
    const canvas = document.getElementById('ovCropCanvas');
    const box = document.getElementById('ovCropBox');
    const bgImg = document.getElementById('ovCropBgImg');
    const fileInp = document.getElementById('ovCropFileInput');
    const clearImgBtn = document.getElementById('ovCropClearImgBtn');
    const fsBtn = document.getElementById('ovCropFullscreenBtn');
    const resetBtn = document.getElementById('ovCropResetBtn');
    const cancelBtn = document.getElementById('ovCropCancelBtn');
    const confirmBtn = document.getElementById('ovCropConfirmBtn');
    if (!modal || !canvas || !box) return;

    if (fileInp) {
      fileInp.onchange = () => {
        const f = fileInp.files && fileInp.files[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = () => {
          ovCropBgUrl = String(reader.result || '');
          if (bgImg && ovCropBgUrl) {
            bgImg.src = ovCropBgUrl;
            bgImg.classList.remove('hidden');
          }
        };
        reader.readAsDataURL(f);
        fileInp.value = '';
      };
    }

    if (clearImgBtn) {
      clearImgBtn.onclick = () => {
        ovCropBgUrl = '';
        if (bgImg) {
          bgImg.removeAttribute('src');
          bgImg.classList.add('hidden');
        }
      };
    }

    if (fsBtn) {
      fsBtn.onclick = () => togglePanelFullscreen();
    }

    if (resetBtn) {
      resetBtn.onclick = () => {
        ovCropDraft = { xPct: 0.12, yPct: 0.75, wPct: 0.76, hPct: 0.18 };
        renderOvCropBox();
      };
    }

    if (cancelBtn) {
      cancelBtn.onclick = () => closeOvVisualCropper(true);
    }

    if (confirmBtn) {
      confirmBtn.onclick = () => {
        applyVideoRoiConfig('custom', ovCropDraft, false);
        closeOvVisualCropper(true);
        render();
      };
    }

    let dragOp = null;
    canvas.addEventListener('pointerdown', (e) => {
      const handleEl = e.target.closest('.ov-crop-handle');
      const isBox = handleEl || e.target === box || e.target.closest('#ovCropBox');
      if (!isBox) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      dragOp = {
        dir: handleEl ? handleEl.getAttribute('data-dir') : 'move',
        startX: e.clientX,
        startY: e.clientY,
        cw: rect.width,
        ch: rect.height,
        orig: { ...ovCropDraft },
        pointerId: e.pointerId
      };
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragOp) return;
      e.preventDefault();
      const dx = (e.clientX - dragOp.startX) / dragOp.cw;
      const dy = (e.clientY - dragOp.startY) / dragOp.ch;
      const minW = Math.max(0.08, 48 / dragOp.cw);
      const minH = Math.max(0.06, 48 / dragOp.ch);
      let { xPct, yPct, wPct, hPct } = dragOp.orig;
      const dir = dragOp.dir;

      if (dir === 'move') {
        xPct = Math.max(0, Math.min(1 - wPct, xPct + dx));
        yPct = Math.max(0, Math.min(1 - hPct, yPct + dy));
      } else {
        if (dir.includes('w')) {
          const maxShift = wPct - minW;
          const shift = Math.max(-xPct, Math.min(maxShift, dx));
          xPct += shift;
          wPct -= shift;
        }
        if (dir.includes('e')) {
          wPct = Math.max(minW, Math.min(1 - xPct, wPct + dx));
        }
        if (dir.includes('n')) {
          const maxShift = hPct - minH;
          const shift = Math.max(-yPct, Math.min(maxShift, dy));
          yPct += shift;
          hPct -= shift;
        }
        if (dir.includes('s')) {
          hPct = Math.max(minH, Math.min(1 - yPct, hPct + dy));
        }
      }
      ovCropDraft = {
        xPct: Number(xPct.toFixed(3)),
        yPct: Number(yPct.toFixed(3)),
        wPct: Number(wPct.toFixed(3)),
        hPct: Number(hPct.toFixed(3))
      };
      renderOvCropBox();
    });

    const stopCropDrag = (e) => {
      if (!dragOp) return;
      try { canvas.releasePointerCapture(dragOp.pointerId); } catch (err) {}
      dragOp = null;
    };
    canvas.addEventListener('pointerup', stopCropDrag);
    canvas.addEventListener('pointercancel', stopCropDrag);
  })();

  window.LZHOverlayApp = {
    applyNativeConfig(cfg) {
      if (!cfg) return;
      if (cfg.nativeLang) state.nativeLang = cfg.nativeLang;
      document.documentElement.classList.toggle('dark', Boolean(cfg.isDark));
      if (cfg.apiMode) state.apiMode = cfg.apiMode;
      if (cfg.apiKey !== undefined) state.apiKey = cfg.apiKey;
      if (cfg.groqApiKey !== undefined) state.groqApiKey = cfg.groqApiKey;
      if (cfg.membershipTier) {
        if (cfg.membershipTier !== state.membershipTier) state.fastRefineExhausted = false;
        state.membershipTier = cfg.membershipTier;
      }
      if (cfg.aiUsage !== undefined) state.aiUsage = cfg.aiUsage;
      if (cfg.videoSourceLang && ['en', 'ja', 'ko', 'zh-TW'].includes(cfg.videoSourceLang)) {
        state.videoSourceLang = cfg.videoSourceLang;
      }
      if (cfg.videoRoiMode || cfg.videoRoiRectJson || cfg.videoRoiRect) {
        let parsedRect = null;
        const rawRectSrc = cfg.videoRoiRectJson !== undefined ? cfg.videoRoiRectJson : cfg.videoRoiRect;
        if (rawRectSrc) {
          try {
            const tmp = typeof rawRectSrc === 'string' ? JSON.parse(rawRectSrc) : rawRectSrc;
            if (tmp && typeof tmp === 'object' && Object.keys(tmp).length > 0) {
              parsedRect = tmp;
            }
          } catch (e) {}
        }
        applyVideoRoiConfig(cfg.videoRoiMode || state.videoRoiMode, parsedRect, true);
      }
      if (Array.isArray(cfg.decks) && cfg.decks.length > 0) state.decks = cfg.decks;
      if (cfg.defaultDeck && state.decks.includes(cfg.defaultDeck)) state.selectedDeck = cfg.defaultDeck;
      if (cfg.chatSession && typeof cfg.chatSession === 'object') {
        state.chatSession = { ...state.chatSession, ...cfg.chatSession };
      }
      if (!state.isVisionBusy && !state.fullscreenFromFreezeService) {
        render();
      }
    },
    onNativeImageCaptured(b64) {
      state.inlineZoom = { scale: 1, tx: 0, ty: 0 };
      state.fsZoom = { scale: 1, tx: 0, ty: 0 };
      if (b64) {
        setImageModeLock(true);
        analyzePhotoBase64(b64, true);
      }
    },
    onNativeFullscreenChanged(isFullscreen) {
      state.panelFullscreen = Boolean(isFullscreen);
      const appPanel = document.getElementById('appPanel');
      if (appPanel) appPanel.classList.toggle('ft-fullscreen', state.panelFullscreen);
      render();
    },
    onNativeSttStateChanged(active, reason) {
      if (active) {
        state.nativeSttRunning = true;
        state.activeLiveMode = 'voice';
        render();
        return;
      }
      const errReason = String(reason || '');
      if (errReason === 'STT_UNAVAILABLE' || errReason === 'STT_START_FAILED') {
        startOverlayWebSpeechFallback();
        return;
      }
      stopVoiceRecognitionMode();
      render();
    },
    openFreezeMode(payload) {
      if (!payload) return;
      state.fullscreenFromFreezeService = true;
      state.fullscreenOpen = true;
      state.photoMode = 'lookup';
      state.photoSelectedIds.clear();
      state.fsBubble = null;
      state.fsZoom = { scale: 1, tx: 0, ty: 0 };
      state.photoDataUrl = payload.imageDataUrl || (payload.imageBase64 ? ('data:image/jpeg;base64,' + payload.imageBase64) : '');
      state.photoBase64 = payload.imageBase64 || '';
      state.photoArticleTranslation = '';
      state.isPhotoArticleTranslating = false;
      state.photoTokens = (Array.isArray(payload.tokens) ? payload.tokens : []).map((t, i) => ({
        id: 'fz_' + i,
        text: String(t.text || '').trim(),
        lang: t.lang || detectLang(t.text),
        reading: String(t.reading || '').trim(),
        pos: String(t.pos || '').trim(),
        translation: String(t.translation || '').trim(),
        box: normalizeBox1000(t.box) || [0, 0, 100, 100]
      })).filter(x => x.text);
      state.photoRawText = String(payload.rawText || '').trim() || state.photoTokens.map(t => t.text).join(' ');
      if (Array.isArray(payload.decks) && payload.decks.length > 0) state.decks = payload.decks;
      if (payload.defaultDeck) state.selectedDeck = payload.defaultDeck;
      if (payload.nativeLang) state.nativeLang = payload.nativeLang;
      document.documentElement.classList.toggle('dark', Boolean(payload.isDark));
      render();
    },
    onNativeSubtitleUpdate(orig, trans, isFinal, tier, lang) {
      if (!orig) return;
      if (!isFinal) {
        if (/[.!?。！？]$/.test(String(orig).trim())) {
          state.sttInterim = '';
          state.sttInterimDraft = '';
          translateFinalSubtitleLine(orig, lang || '');
        } else {
          handleInterimSubtitleUpdate(orig, trans, lang || '');
        }
        return;
      }
      state.sttInterim = '';
      state.sttInterimDraft = '';
      if (trans) {
        clearSttStabilizerTimers();
        sttActiveProvisionalId = '';
        pushSubtitleEntryAndHud(orig, trans, tier || 'refined', lang || '');
      } else {
        translateFinalSubtitleLine(orig, lang || '');
      }
    }
  };

  window.addEventListener('beforeunload', () => {
    stopYoutubePlayback();
    stopVoiceRecognitionMode();
    stopScreenSubtitleMode();
    closeChatStreams();
  });

  document.addEventListener('focusin', (e) => {
    const target = e && e.target;
    if (!target || typeof target.scrollIntoView !== 'function') return;
    const tag = (target.tagName || '').toUpperCase();
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || target.isContentEditable) {
      setTimeout(() => {
        try {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } catch (err) {}
      }, 260);
    }
  });

  try {
    const initRaw = window.AndroidOverlay?.getInitialConfig();
    if (initRaw) window.LZHOverlayApp.applyNativeConfig(JSON.parse(initRaw));
    else render();
  } catch (e) {
    render();
  }
})();
</script>
</body>
</html>
